# Keeps the archive up to date for free: every 6 hours it re-reads the game data,
# the build sources and the creator channels, re-checks every write-up against
# the live perk text, commits only what changed, and redeploys GitHub Pages.
name: Sync and deploy

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-and-deploy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync game data, builds and videos
        run: node api/sync.mjs
      - name: Tests (engine + fact-checker regressions)
        run: npm test
      - name: Fact-check report
        run: node api/tools/factcheck.mjs || true
      - name: Commit changed data
        run: |
          git config user.name "fog-archive-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/api site/assets data
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Sync game data and builds" && git push; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
